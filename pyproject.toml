[project]
name = "capmetric"
version = "1.0.0"
description = "Approximation Capacity metric for clustering problems."
authors = [
    {name = "Victor Jimenez Rodriguez",email = "vjimenez@ethz.ch"}
]
readme = "README.md"
license = { file = "LICENSE" }

requires-python = ">=3.9"
dependencies = [
    "torch (>=2.7.1,<3.0.0)",
    "torchmetrics (>=1.7.3,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)"
]

[project.optional-dependencies]
lightning = ["pytorch-lightning (>=2.5.2,<3.0.0)"]
